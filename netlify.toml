# Netlify 构建前端并自动打包服务端函数；不能仅拖拽上传 out 目录。
[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # 模型名称是公开配置，不是密钥；避免它被 Netlify Secret Scanner 误判。
  SECRETS_SCAN_OMIT_KEYS = "DEEPSEEK_MODEL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
